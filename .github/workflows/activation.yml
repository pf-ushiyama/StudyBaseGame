name: 1. Unityライセンス申請ファイルの作成

on:
  workflow_dispatch: # GitHubの画面から手動ボタンで動かす設定

jobs:
  get-alf:
    name: .alfファイルを生成する
    runs-on: ubuntu-latest
    steps:
      - name: コードをダウンロード
        uses: actions/checkout@v4

      - name: リクエストファイル(.alf)の生成
        uses: game-ci/unity-request-activation-file@v2
        id: get-alf

      - name: 生成したファイルをダウンロード用に保存
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.get-alf.outputs.filePath }}